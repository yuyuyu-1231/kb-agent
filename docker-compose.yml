# kb-agent 一键启动：应用 + Qdrant
#
# 三个必须理解的点：
#
# 1. **QDRANT_URL 用服务名 `qdrant`，不是 localhost**
#    容器里的 localhost 指的是容器自己，连不到隔壁的 Qdrant。
#    compose 会为每个服务建一条 DNS 记录，服务名就是主机名。
#
# 2. **qdrant 数据放在 named volume 里**
#    容器重建不会丢数据。但**新建的 volume 是空的**，
#    所以应用启动时要自动入库（见 AUTO_INGEST）。
#
# 3. **./data 挂到容器里**
#    corpus（PDF）、trace、kb.db 都在宿主机上，
#    容器删了数据还在。这也是自动入库能看到 PDF 的前提。
#
# 启动：
#   docker compose up -d --build
# 查看日志：
#   docker compose logs -f app
# 停止（保留数据）：
#   docker compose down
# 停止并删除 Qdrant 数据（谨慎）：
#   docker compose down -v

services:
  qdrant:
    # 固定大版本，latest 会导致"昨天能跑今天不能跑"
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl/wget，但 bash 支持 /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MySQL：只有 DB_BACKEND=mysql 时才会被真正用到。
  #
  # 为什么不把它写进 app 的 depends_on：
  # depends_on 是静态的，写进去之后 SQLite 模式也要等 MySQL 变 healthy，
  # 启动从 10 秒变 40 秒。改成由应用层的 wait_for_db() 自己重试（30 秒）。
  mysql:
    # 固定大版本：latest 会导致“昨天能跑今天不能跑”；8.4 是 LTS
    image: mysql:8.4
    container_name: kb-mysql
    restart: unless-stopped
    # profiles：默认**不启动**。
    #
    # 为什么不默认起：
    # - 2 核 2G 的演示服务器上，MySQL 吃掉 ~400MB，和 app 抢内存会 OOM
    # - DB_BACKEND 缺省是 sqlite，大部分时候根本用不到它
    #
    # 需要时：docker compose --profile mysql up -d mysql
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kb_agent}
      MYSQL_USER: ${MYSQL_USER:-kb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kbpass}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # named volume：容器重建不丢数据。
      # 删数据用 `docker compose down -v`，那是不可逆操作。
      - mysql_data:/var/lib/mysql
    command:
      # utf8mb4：默认的 utf8 是三字节，存 emoji / 部分生僻字会报错，
      # 而且中文排序依赖 collation。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # mysqladmin ping 是最轻的探活；必须带密码，否则 MySQL 8 会报
      # “Access denied”，健康检查永远不通过。
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # .env 里有 LLM_API_KEY，绝不能写进镜像
      - .env
    environment:
      # 覆盖 .env 里的 localhost —— 容器里连不到宿主机的 localhost
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: kb_chunks
      # 容器启动时如果 collection 是空的，自动把 data/corpus 下的 PDF 入库。
      # 幂等：已经有数据就跳过，不会重复入库。
      AUTO_INGEST: "true"
      # 存储后端：缺省 sqlite。改成 mysql 时下面四项生效。
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      # 服务名 mysql，不是 localhost（同 QDRANT_URL 的道理）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-kb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kbpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kb_agent}
    volumes:
      - ./data:/app/data
      # 前端是单文件静态页，挂进去就不用每次改 HTML 都重建镜像。
      # 只读：容器不需要写它。
      - ./app/static:/app/app/static:ro
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
    name: kb-agent-qdrant-storage
  mysql_data:
    name: kb-agent-mysql-data

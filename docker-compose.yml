# kb-agent 一键启动：应用 + Qdrant
#
# 三个必须理解的点：
#
# 1. **QDRANT_URL 用服务名 `qdrant`，不是 localhost**
#    容器里的 localhost 指的是容器自己，连不到隔壁的 Qdrant。
#    compose 会为每个服务建一条 DNS 记录，服务名就是主机名。
#
# 2. **qdrant 数据放在 named volume 里**
#    容器重建不会丢数据。但**新建的 volume 是空的**，
#    所以应用启动时要自动入库（见 AUTO_INGEST）。
#
# 3. **./data 挂到容器里**
#    corpus（PDF）、trace、kb.db 都在宿主机上，
#    容器删了数据还在。这也是自动入库能看到 PDF 的前提。
#
# 启动：
#   docker compose up -d --build
# 查看日志：
#   docker compose logs -f app
# 停止（保留数据）：
#   docker compose down
# 停止并删除 Qdrant 数据（谨慎）：
#   docker compose down -v

services:
  qdrant:
    # 固定大版本，latest 会导致"昨天能跑今天不能跑"
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl/wget，但 bash 支持 /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # .env 里有 LLM_API_KEY，绝不能写进镜像
      - .env
    environment:
      # 覆盖 .env 里的 localhost —— 容器里连不到宿主机的 localhost
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: kb_chunks
      # 容器启动时如果 collection 是空的，自动把 data/corpus 下的 PDF 入库。
      # 幂等：已经有数据就跳过，不会重复入库。
      AUTO_INGEST: "true"
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
    name: kb-agent-qdrant-storage
